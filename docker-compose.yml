services:
  postgres:
    image: postgres:16-alpine
    container_name: gamementor-postgres
    environment:
      POSTGRES_DB: gamementor
      POSTGRES_USER: gamementor
      POSTGRES_PASSWORD: gamementor
    ports:
      - "5432:5432"
    volumes:
      - gamementor_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamementor -d gamementor"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: gamementor-redis
    command: ["redis-server", "--save", "60", "1", "--maxmemory", "256mb", "--maxmemory-policy", "allkeys-lru"]
    ports:
      - "6379:6379"
    volumes:
      - gamementor_redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate:v4.18.2
    container_name: gamementor-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./backend/migrations:/migrations
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://gamementor:gamementor@postgres:5432/gamementor?sslmode=disable",
        "up"
      ]
    restart: "no"

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: gamementor-backend
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: postgres://gamementor:gamementor@postgres:5432/gamementor?sslmode=disable
      REDIS_URL: ${REDIS_URL:-redis://redis:6379/0}
      HTTP_ADDR: :8080
      OPENDOTA_BASE_URL: ${OPENDOTA_BASE_URL:-https://api.opendota.com}
      OPENDOTA_API_KEY: ${OPENDOTA_API_KEY:-}
      OPENDOTA_TIMEOUT: ${OPENDOTA_TIMEOUT:-10s}
      STRATZ_API_KEY: ${STRATZ_API_KEY:-}
      STEAM_API_KEY: ${STEAM_API_KEY:-}
      AI_PROVIDER: ${AI_PROVIDER:-}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_MODEL: ${AI_MODEL:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      AI_TIMEOUT: ${AI_TIMEOUT:-60s}
      JWT_SECRET: ${JWT_SECRET:-gamementor-dev-insecure-secret-change-me}
      JWT_TTL: ${JWT_TTL:-168h}
      HTTP_READ_HEADER_TIMEOUT: ${HTTP_READ_HEADER_TIMEOUT:-5s}
      HTTP_SHUTDOWN_TIMEOUT: ${HTTP_SHUTDOWN_TIMEOUT:-10s}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

  # React/Vite web app (frontend-make — design from Figma Make). nginx serves the build and proxies /api -> backend.
  frontend:
    build:
      context: ./frontend-make
      dockerfile: Dockerfile
    container_name: gamementor-frontend
    ports:
      - "5174:80"
    depends_on:
      backend:
        condition: service_healthy
    restart: unless-stopped

volumes:
  gamementor_pg_data:
  gamementor_redis_data:
