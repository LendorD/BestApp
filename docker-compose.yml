services:
  postgres:
    image: postgres:16-alpine
    container_name: gamementor-postgres
    environment:
      POSTGRES_DB: gamementor
      POSTGRES_USER: gamementor
      POSTGRES_PASSWORD: gamementor
    ports:
      - "5432:5432"
    volumes:
      - gamementor_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U gamementor -d gamementor"]
      interval: 5s
      timeout: 3s
      retries: 10

  migrate:
    image: migrate/migrate:v4.18.2
    container_name: gamementor-migrate
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ./migrations:/migrations
    command:
      [
        "-path",
        "/migrations",
        "-database",
        "postgres://gamementor:gamementor@postgres:5432/gamementor?sslmode=disable",
        "up"
      ]
    restart: "no"

  backend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: gamementor-backend
    environment:
      APP_ENV: ${APP_ENV:-local}
      DATABASE_URL: postgres://gamementor:gamementor@postgres:5432/gamementor?sslmode=disable
      HTTP_ADDR: :8080
      OPENDOTA_BASE_URL: ${OPENDOTA_BASE_URL:-https://api.opendota.com}
      OPENDOTA_TIMEOUT: ${OPENDOTA_TIMEOUT:-10s}
      HTTP_READ_HEADER_TIMEOUT: ${HTTP_READ_HEADER_TIMEOUT:-5s}
      HTTP_SHUTDOWN_TIMEOUT: ${HTTP_SHUTDOWN_TIMEOUT:-10s}
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health >/dev/null 2>&1 || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  gamementor_pg_data:
