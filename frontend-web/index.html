    <title>GameMentor</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />

    <style>
      *, *::before, *::after { box-sizing: border-box; }
      html, body { margin: 0; padding: 0; background: #050608; color: #F4F6FA; font-family: Manrope, sans-serif; }
      button, input, textarea { font-family: Manrope, sans-serif; }
      ::-webkit-scrollbar { width: 8px; height: 8px; }
      ::-webkit-scrollbar-thumb { background: #1B2430; border-radius: 6px; }
      ::-webkit-scrollbar-track { background: #0B0E13; }
      * { scrollbar-width: thin; scrollbar-color: #1B2430 #0B0E13; }
    </style>
