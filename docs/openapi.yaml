openapi: 3.0.3
info:
  title: GameMentor API
  version: 0.1.0
  description: MVP API for CS2 grenade guides and Dota 2 player analytics.
servers:
  - url: http://localhost:8080
paths:
  /health:
    get:
      tags: [System]
      summary: Healthcheck
      responses:
        "200":
          description: Service is healthy
  /api/v1/cs2/maps:
    get:
      tags: [CS2]
      summary: List supported CS2 maps
      responses:
        "200":
          description: Maps list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CS2MapsResponse"
  /api/v1/cs2/grenades:
    post:
      tags: [CS2]
      summary: Create CS2 grenade
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CS2GrenadeInput"
      responses:
        "201":
          description: Created grenade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CS2GrenadeResponse"
        "400":
          $ref: "#/components/responses/Error"
    get:
      tags: [CS2]
      summary: List CS2 grenades
      parameters:
        - in: query
          name: map
          schema:
            type: string
            example: mirage
        - in: query
          name: side
          schema:
            type: string
            enum: [T, CT]
        - in: query
          name: type
          schema:
            type: string
            enum: [smoke, flash, molotov, he]
        - in: query
          name: difficulty
          schema:
            type: string
            enum: [easy, medium, hard]
        - in: query
          name: limit
          schema:
            type: integer
            default: 50
        - in: query
          name: offset
          schema:
            type: integer
            default: 0
      responses:
        "200":
          description: Grenades list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CS2GrenadesResponse"
  /api/v1/cs2/grenades/{id}:
    get:
      tags: [CS2]
      summary: Get CS2 grenade by id
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Grenade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CS2GrenadeResponse"
        "404":
          $ref: "#/components/responses/Error"
    put:
      tags: [CS2]
      summary: Update CS2 grenade
      parameters:
        - $ref: "#/components/parameters/ID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CS2GrenadeInput"
      responses:
        "200":
          description: Updated grenade
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CS2GrenadeResponse"
    delete:
      tags: [CS2]
      summary: Delete CS2 grenade
      parameters:
        - $ref: "#/components/parameters/ID"
      responses:
        "200":
          description: Deleted
  /api/v1/dota/players/{account_id}:
    get:
      tags: [Dota]
      summary: Get Dota 2 player profile from OpenDota and save it
      parameters:
        - $ref: "#/components/parameters/AccountID"
      responses:
        "200":
          description: Player profile
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DotaPlayerResponse"
  /api/v1/dota/players/{account_id}/matches:
    get:
      tags: [Dota]
      summary: Get recent Dota 2 matches from OpenDota and save them
      parameters:
        - $ref: "#/components/parameters/AccountID"
      responses:
        "200":
          description: Recent matches
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DotaMatchesResponse"
  /api/v1/dota/players/{account_id}/summary:
    get:
      tags: [Dota]
      summary: Calculate Dota 2 summary and save snapshot
      parameters:
        - $ref: "#/components/parameters/AccountID"
      responses:
        "200":
          description: Player summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DotaSummaryResponse"
components:
  parameters:
    ID:
      in: path
      name: id
      required: true
      schema:
        type: integer
        format: int64
    AccountID:
      in: path
      name: account_id
      required: true
      schema:
        type: integer
        format: int64
  responses:
    Error:
      description: Unified error response
      content:
        application/json:
          schema:
            $ref: "#/components/schemas/ErrorResponse"
  schemas:
    Envelope:
      type: object
      required: [success]
      properties:
        success:
          type: boolean
    ErrorResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            error:
              type: object
              properties:
                code:
                  type: string
                message:
                  type: string
    CS2Map:
      type: object
      properties:
        id:
          type: integer
          format: int64
        code:
          type: string
          example: mirage
        display_name:
          type: string
          example: Mirage
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CS2Grenade:
      type: object
      properties:
        id:
          type: integer
          format: int64
        map:
          type: string
          example: mirage
        side:
          type: string
          enum: [T, CT]
        type:
          type: string
          enum: [smoke, flash, molotov, he]
        title:
          type: string
          example: Window smoke from T spawn
        description:
          type: string
        from_position:
          type: string
          example: T spawn
        to_position:
          type: string
          example: Window
        difficulty:
          type: string
          enum: [easy, medium, hard]
        image_url:
          type: string
        video_url:
          type: string
        tags:
          type: array
          items:
            type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    CS2GrenadeInput:
      type: object
      required: [map, side, type, title, from_position, to_position, difficulty]
      properties:
        map:
          type: string
          example: mirage
        side:
          type: string
          example: T
        type:
          type: string
          example: smoke
        title:
          type: string
        description:
          type: string
        from_position:
          type: string
        to_position:
          type: string
        difficulty:
          type: string
          example: easy
        image_url:
          type: string
        video_url:
          type: string
        tags:
          type: array
          items:
            type: string
    DotaPlayer:
      type: object
      properties:
        account_id:
          type: integer
          format: int64
        persona_name:
          type: string
        avatar_full:
          type: string
        profile_url:
          type: string
        rank_tier:
          type: integer
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
    DotaMatch:
      type: object
      properties:
        match_id:
          type: integer
          format: int64
        account_id:
          type: integer
          format: int64
        player_slot:
          type: integer
        radiant_win:
          type: boolean
        won:
          type: boolean
        hero_id:
          type: integer
        kills:
          type: integer
        deaths:
          type: integer
        assists:
          type: integer
        duration_seconds:
          type: integer
        start_time:
          type: string
          format: date-time
    DotaHeroSummary:
      type: object
      properties:
        hero_id:
          type: integer
        matches:
          type: integer
        wins:
          type: integer
        winrate:
          type: number
    DotaSummary:
      type: object
      properties:
        account_id:
          type: integer
          format: int64
        matches:
          type: integer
        wins:
          type: integer
        losses:
          type: integer
        winrate:
          type: number
        average_kills:
          type: number
        average_deaths:
          type: number
        average_assists:
          type: number
        kda:
          type: number
        top_heroes:
          type: array
          items:
            $ref: "#/components/schemas/DotaHeroSummary"
        snapshot_id:
          type: integer
          format: int64
        snapshotted_at:
          type: string
          format: date-time
    CS2MapsResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/CS2Map"
    CS2GrenadeResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/CS2Grenade"
    CS2GrenadesResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/CS2Grenade"
    DotaPlayerResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/DotaPlayer"
    DotaMatchesResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              type: array
              items:
                $ref: "#/components/schemas/DotaMatch"
    DotaSummaryResponse:
      allOf:
        - $ref: "#/components/schemas/Envelope"
        - type: object
          properties:
            data:
              $ref: "#/components/schemas/DotaSummary"
